apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-config
  namespace: {{ .Values.nameSpace }}
data:
  nginx.conf: |
    worker_processes 1;
    events { worker_connections 1024; }

    http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log  /var/log/nginx/error.log  error;
    #client_body_timeout 100;
    #client_header_timeout 100;
    client_max_body_size 20m;
    large_client_header_buffers 4 16k;
    client_header_buffer_size 16k; 
    proxy_buffer_size 16k;
    proxy_buffers 4 16k;

    server {
        listen 8080;
        listen 443 ssl;
        server_name webapp-nginx-proxy;

        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;

        #ssl_certificate /etc/nginx/certs/tls.crt;  # Path to tls certificate
        #ssl_certificate_key /etc/nginx/certs/tls.key;  # Path to tls private key

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;

        resolver 127.0.0.11 valid=10s ipv6=off;

        client_max_body_size 5m;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        #location ^~ /api/ {
        #    set $api_upstream http://webapi:3001;
        #    proxy_pass $api_upstream;
        #    proxy_http_version 1.1;
        #    proxy_set_header Host $host;
        #    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #    proxy_set_header X-Forwarded-Proto $scheme;
        #    proxy_set_header Authorization $http_authorization;
        #}

        location ~* \.(?:css|js|mjs|svg|ico|png|jpe?g|gif|webp|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html =404;
        }

    }

    }