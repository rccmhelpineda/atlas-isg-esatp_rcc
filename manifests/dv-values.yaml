dbSec:
- sKey: DB_USER
  sManagerName: isg/esatp/dv/esatp_sme-sm
  sManagerKey: username
- sKey: DB_PASS
  sManagerName: isg/esatp/dv/esatp_sme-sm
  sManagerKey: password
- sKey: DB_NAME
  sManagerName: isg/esatp/dv/esatp_sme-sm
  sManagerKey: dbname
- sKey: DB_DIALECT
  sManagerName: isg/esatp/dv/esatp_sme-sm
  sManagerKey: engine
- sKey: DB_HOST
  sManagerName: isg/esatp/dv/esatp_sme-sm
  sManagerKey: host

esesel:
  #  seeartee: ZHVtbXkK
  seeartee: 

appSec:
  - sKey: TLS_KEY
    sManagerName: isg/esatp/dv/esatp_app-sm
    sManagerKey: tls_key
  - sKey: TLS_CERT
    sManagerName: isg/esatp/dv/esatp_app-sm
    sManagerKey: tls_crt
  - sKey: TLS_RSA_KEY
    sManagerName: isg/esatp/dv/esatp_app-sm
    sManagerKey: rsa_key

esatp-webapp:
  esatpWebApp:
    esatpWebAppHpa:
      maxReplicas: 2
      minReplicas: 1
      metrics:
        - resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 60
          type: Resource
    esatpWebAppContainer:
      image:
        repository: globe.pe.jfrog.io/isg-esatp-docker-local-nonprod/dv/esatp-webapp
        tag: v0.0.1
      resources:
        limits:
          cpu: "250m"
          memory: "360Mi"
        requests:
          cpu: "150m"
          memory: "260Mi"
    replicas: 1
esatp-webapi:
  esatpWebApi:
    esatpWebApiHpa:
      maxReplicas: 2
      minReplicas: 1
      metrics:
        - resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 60
          type: Resource
    esatpWebApiSQSHpa:
      maxReplicas: 2
      minReplicas: 1
      metrics:
        - resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 60
          type: Resource
    esatpWebApiContainer:
      image:
        repository: globe.pe.jfrog.io/isg-esatp-docker-local-nonprod/dv/esatp-webapi
        tag: v0.0.1
      resources:
        limits:
          cpu: "300m"
          memory: "460Mi"
        requests:
          cpu: "250m"
          memory: "360Mi"
    esatpWebApiSQSContainer:
      image:
        repository: globe.pe.jfrog.io/isg-esatp-docker-local-nonprod/dv/esatp-webapi
      resources:
        limits:
          cpu: "350m"
          memory: "400Mi"
        requests:
          cpu: "300m"
          memory: "300Mi"
    esatpWebApiCronJobContainer:
      image:
        repository: globe.pe.jfrog.io/isg-esatp-docker-local-nonprod/dv/esatp-webapi
      resources:
        limits:
          cpu: "400m"
          memory: "500Mi"
        requests:
          cpu: "300m"
          memory: "400Mi"
    replicas: 1
    replicasSQS: 1


  