apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "esatp-webapp.fullname" . }}-hpa
  labels:
  {{- include "esatp-webapp.labels" . | nindent 4 }}
spec:
  {{- toYaml .Values.esatpWebApp.esatpWebAppAdmHpa | nindent 2 }}
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "esatp-webapp.fullname" . }}-deploy


